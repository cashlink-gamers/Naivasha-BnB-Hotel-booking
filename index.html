<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naivasha Stays — find a room, book direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --lake: #0F3D3E;
    --lake-light: #E4EEE9;
    --gold: #C89B3C;
    --gold-dark: #8C6A22;
    --pink: #E8677D;
    --pink-dark: #A63C4C;
    --sand: #FBF7EE;
    --ink: #232620;
    --ink-soft: #5B5F55;
    --line: #E3DCC9;
    --card: #FFFFFF;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--sand);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;}
  h1,h2,h3,.disp{font-family:'Fraunces',serif;}
  a{color:inherit;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  header{background:var(--lake);color:var(--sand);padding:18px 24px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:30px;height:30px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--lake);font-weight:600;font-size:14px;}
  .brand-name{font-size:18px;font-weight:500;}
  .brand-sub{font-size:11px;color:#C7D8D2;margin-top:-2px;}
  nav button{background:transparent;color:var(--sand);font-size:13px;padding:8px 12px;border-radius:8px;opacity:.85;}
  nav button.active{background:rgba(255,255,255,.12);opacity:1;}

  .hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#0B2E30 0%,#154C4C 45%,#1F6659 70%,#3C8C6E 100%);padding:0 0 46px;color:var(--sand);}
  .hero-scene{position:relative;height:230px;overflow:hidden;}
  .sun{position:absolute;top:26px;right:14%;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FCE5A8,var(--gold));opacity:.9;}
  .cloud{position:absolute;background:rgba(255,255,255,.18);border-radius:100px;filter:blur(1px);}
  .c1{width:120px;height:26px;top:20px;left:8%;animation:drift 46s linear infinite;}
  .c2{width:80px;height:18px;top:55px;left:55%;animation:drift 60s linear infinite;animation-delay:-15s;}
  @keyframes drift{from{transform:translateX(-140px);}to{transform:translateX(110vw);}}

  .water{position:absolute;bottom:0;left:0;right:0;height:70px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0));}
  .ripple{position:absolute;bottom:8px;height:2px;background:rgba(255,255,255,.35);border-radius:100px;animation:ripple 5s ease-in-out infinite;}
  @keyframes ripple{0%,100%{opacity:.15;transform:scaleX(.9);}50%{opacity:.5;transform:scaleX(1.05);}}

  .safari-track{position:absolute;bottom:14px;left:0;width:200%;height:60px;display:flex;align-items:flex-end;animation:walk 34s linear infinite;}
  @keyframes walk{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .safari-track svg{height:52px;width:auto;margin-right:70px;opacity:.9;flex-shrink:0;}
  .animal{fill:#0B2E30;opacity:.55;}

  .hero-text{position:relative;text-align:center;padding:26px 24px 0;}
  .hero-text h1{font-size:32px;font-weight:500;margin:0 0 10px;max-width:560px;margin-left:auto;margin-right:auto;}
  .hero-text p{font-size:14.5px;color:#D7E7E0;max-width:460px;margin:0 auto 22px;}

  .photo-carousel{position:relative;max-width:560px;margin:0 auto 22px;height:150px;}
  .pc-card{position:absolute;inset:0;border-radius:14px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.28);opacity:0;transform:scale(.96);transition:opacity 1s ease,transform 1s ease;}
  .pc-card.active{opacity:1;transform:scale(1);}
  .pc-card img{width:100%;height:100%;object-fit:cover;display:block;}
  .pc-caption{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);font-size:12.5px;text-align:left;color:#fff;}

  .hero-card{background:var(--card);color:var(--ink);max-width:520px;margin:0 auto;border-radius:var(--radius);padding:16px;box-shadow:0 10px 30px rgba(15,61,62,.25);display:flex;gap:10px;flex-wrap:wrap;position:relative;}
  .hero-card input,.hero-card select{flex:1;min-width:120px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;}
  .hero-card button{background:var(--gold);color:#3A2B08;padding:10px 18px;border-radius:9px;font-weight:600;font-size:14px;}

  main{max-width:1000px;margin:0 auto;padding:36px 20px 60px;}
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .section-title h2{font-size:22px;font-weight:500;margin:0;}
  .section-title span{font-size:13px;color:var(--ink-soft);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;}
  .listing-card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);transition:transform .15s ease;}
  .listing-card:hover{transform:translateY(-2px);}
  .lc-photo{position:relative;height:150px;background:#DDD;overflow:hidden;}
  .lc-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .lc-type{position:absolute;top:10px;left:10px;background:rgba(15,61,62,.85);color:#fff;font-size:11px;padding:3px 9px;border-radius:100px;letter-spacing:.02em;}
  .lc-body{padding:14px 16px 16px;}
  .lc-body h3{font-size:16px;font-weight:500;margin:0 0 4px;}
  .lc-loc{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;}
  .lc-foot{display:flex;align-items:center;justify-content:space-between;}
  .lc-price{font-size:15px;font-weight:600;color:var(--lake);}
  .lc-price small{font-weight:400;color:var(--ink-soft);font-size:11.5px;}
  .lc-btn{background:var(--lake-light);color:var(--lake);font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:8px;}

  .empty{text-align:center;padding:50px 20px;color:var(--ink-soft);border:1px dashed var(--line);border-radius:var(--radius);}

  .overlay{position:fixed;inset:0;background:rgba(24,26,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
  .modal{background:var(--card);border-radius:16px;max-width:560px;width:100%;overflow:hidden;}
  .modal-photo{height:220px;background:#DDD;position:relative;}
  .modal-photo img{width:100%;height:100%;object-fit:cover;}
  .modal-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);}
  .dot.active{background:#fff;}
  .modal-close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);color:#fff;width:30px;height:30px;border-radius:50%;font-size:16px;}
  .modal-body{padding:20px 22px 24px;}
  .modal-body h2{margin:0 0 4px;font-size:21px;}
  .modal-body .loc{color:var(--ink-soft);font-size:13px;margin-bottom:14px;}
  .modal-body p.desc{font-size:14px;color:var(--ink);margin-bottom:18px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .field label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;}
  .total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px dashed var(--line);margin-top:8px;font-size:15px;}
  .total-row b{color:var(--lake);font-size:19px;}
  .err{color:var(--pink-dark);font-size:12.5px;margin:-4px 0 10px;}
  .pay-btn{width:100%;background:var(--pink);color:#fff;padding:13px;border-radius:10px;font-weight:600;font-size:14.5px;margin-top:6px;}
  .pay-btn:disabled{opacity:.6;}
  .note{font-size:11.5px;color:var(--ink-soft);margin-top:10px;text-align:center;}

  .paybill-box{background:var(--lake-light);border-radius:12px;padding:14px 16px;margin:14px 0;}
  .paybill-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:5px 0;}
  .paybill-row b{color:var(--lake);font-size:15px;letter-spacing:.02em;}
  .paybill-steps{font-size:12px;color:var(--ink-soft);margin:8px 0 0;padding-left:16px;}

  .confirm{padding:30px 22px;text-align:center;}
  .confirm .badge{width:52px;height:52px;border-radius:50%;background:var(--lake-light);color:var(--lake);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;}
  .confirm h2{font-size:19px;margin:0 0 8px;}
  .confirm p{font-size:13.5px;color:var(--ink-soft);max-width:360px;margin:0 auto 18px;}
  .confirm button{background:var(--lake);color:#fff;padding:10px 20px;border-radius:9px;font-size:13.5px;}

  .admin-gate{max-width:340px;margin:60px auto;text-align:center;background:var(--card);padding:30px;border-radius:var(--radius);border:1px solid var(--line);}
  .admin-gate input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:14px 0;font-size:14px;}
  .admin-gate button{background:var(--lake);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;}
  .admin-gate button:disabled{opacity:.6;}

  .admin-form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:28px;}
  .admin-form h3{margin:0 0 4px;font-size:17px;}
  .admin-form .hint{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}
  .admin-form .field{margin-bottom:12px;}
  .admin-form textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;min-height:70px;resize:vertical;}
  .photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .photo-thumb{width:64px;height:64px;border-radius:8px;overflow:hidden;position:relative;}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;}
  .photo-thumb button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;line-height:1;}
  .upload-btn{border:1px dashed var(--line);border-radius:8px;padding:9px 14px;font-size:13px;color:var(--ink-soft);background:var(--sand);}
  .save-btn{background:var(--gold);color:#3A2B08;padding:10px 20px;border-radius:9px;font-weight:600;font-size:13.5px;margin-top:6px;}
  .save-btn:disabled{opacity:.6;}
  .admin-list-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;}
  .admin-list-item img{width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0;}
  .admin-list-item .info{flex:1;}
  .admin-list-item .info b{font-size:14px;}
  .admin-list-item .info div{font-size:12px;color:var(--ink-soft);}
  .del-btn{background:#F6E3E3;color:var(--pink-dark);font-size:12px;padding:6px 10px;border-radius:7px;}
  .status{font-size:12px;padding:2px 8px;border-radius:100px;background:var(--lake-light);color:var(--lake);margin-left:6px;}
  .saved-tag{font-size:12px;color:var(--lake);margin-left:10px;opacity:0;transition:opacity .3s;}
  .saved-tag.show{opacity:1;}
  .booking-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;}
  .booking-item .binfo b{font-size:14px;}
  .booking-item .meta{color:var(--ink-soft);margin-top:3px;}
  .paid-toggle{font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;flex-shrink:0;}
  .paid-toggle.is-paid{background:var(--lake-light);color:var(--lake);}
  .paid-toggle.not-paid{background:#F6EBD8;color:var(--gold-dark);}

  .revenue-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;}
  .revenue-table th,.revenue-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);}
  .revenue-table th{background:var(--lake-light);color:var(--lake);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;}
  .revenue-table tr:last-child td{border-bottom:none;}
  .revenue-table tfoot td{font-weight:700;background:var(--sand);}
  .revenue-note{font-size:12px;color:var(--ink-soft);margin-top:8px;}

  .setup-box{max-width:380px;margin:60px auto;background:var(--card);padding:30px;border-radius:var(--radius);border:1px solid var(--line);}
  .setup-box h3{margin:0 0 4px;}
  .setup-box p{font-size:13px;color:var(--ink-soft);margin:0 0 14px;}
  .setup-box input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px;font-size:14px;}
  .setup-box button{background:var(--lake);color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;width:100%;}
  .setup-box button:disabled{opacity:.6;}

  .change-pass-form{display:flex;flex-direction:column;gap:10px;max-width:340px;}
  .change-pass-form input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">NS</div>
    <div>
      <div class="brand-name">Naivasha Stays</div>
      <div class="brand-sub">Book direct, no back and forth</div>
    </div>
  </div>
  <nav>
    <button id="navBrowse" class="active">Browse</button>
    <button id="navAdmin">Admin</button>
  </nav>
</header>

<section class="hero" id="heroSection">
  <div class="hero-scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="safari-track" id="safariTrack"></div>
    <div class="water">
      <div class="ripple" style="left:5%;width:120px;animation-delay:0s;"></div>
      <div class="ripple" style="left:40%;width:180px;animation-delay:-2s;"></div>
      <div class="ripple" style="left:70%;width:100px;animation-delay:-3.5s;"></div>
    </div>
  </div>
  <div class="hero-text">
    <h1>Every room I've got, in one link</h1>
    <p>Send this page to anyone asking about a stay in Naivasha. They pick a room, see real photos, and pay straight through — no more back-and-forth on DMs.</p>
    <div class="photo-carousel" id="photoCarousel"></div>
    <div class="hero-card">
      <input id="searchInput" type="text" placeholder="Search by name or area">
      <select id="typeFilter">
        <option value="">All types</option>
        <option value="Airbnb">Airbnb</option>
        <option value="Hotel">Hotel</option>
      </select>
      <button id="searchBtn">Search</button>
    </div>
  </div>
</section>

<main id="mainArea"></main>

<script>
let listings = [];
let settings = { paybill: '545542', account: '385091' };
let currentView = 'browse';
let adminUnlocked = false;
let adminPassword = null; // kept only in memory for this tab, sent per request, never stored
let modalListing = null;

const animalSvgs = [
  `<svg viewBox="0 0 60 52" xmlns="http://www.w3.org/2000/svg"><g class="animal"><rect x="27" y="4" width="4" height="26" rx="2"/><ellipse cx="29" cy="6" rx="5" ry="4"/><rect x="20" y="28" width="4" height="18" rx="1"/><rect x="34" y="28" width="4" height="18" rx="1"/><rect x="14" y="30" width="24" height="6" rx="3"/></g></svg>`,
  `<svg viewBox="0 0 60 52" xmlns="http://www.w3.org/2000/svg"><g class="animal"><ellipse cx="28" cy="26" rx="18" ry="12"/><path d="M12 30 q-6 6 -3 16 q4 -2 5 -8 z"/><rect x="16" y="36" width="5" height="12" rx="2"/><rect x="26" y="36" width="5" height="12" rx="2"/><rect x="36" y="36" width="5" height="12" rx="2"/><circle cx="42" cy="20" r="3"/></g></svg>`,
  `<svg viewBox="0 0 60 52" xmlns="http://www.w3.org/2000/svg"><g class="animal"><ellipse cx="26" cy="26" rx="15" ry="9"/><rect x="10" y="12" width="5" height="16" rx="2"/><rect x="16" y="32" width="4" height="14" rx="1"/><rect x="30" y="32" width="4" height="14" rx="1"/><path d="M40 22 q6 -2 6 4 q-4 2 -6 0z"/></g></svg>`,
  `<svg viewBox="0 0 60 52" xmlns="http://www.w3.org/2000/svg"><g class="animal"><circle cx="18" cy="22" r="11"/><ellipse cx="30" cy="28" rx="16" ry="9"/><rect x="20" y="34" width="4" height="12" rx="1"/><rect x="34" y="34" width="4" height="12" rx="1"/></g></svg>`,
  `<svg viewBox="0 0 60 52" xmlns="http://www.w3.org/2000/svg"><g class="animal"><ellipse cx="28" cy="28" rx="18" ry="11"/><path d="M10 26 l-6 -2 l1 4 l5 2z"/><rect x="16" y="36" width="5" height="12" rx="2"/><rect x="34" y="36" width="5" height="12" rx="2"/></g></svg>`
];

function buildSafariTrack(){
  const track = document.getElementById('safariTrack');
  let html = '';
  for(let i=0;i<2;i++){ animalSvgs.forEach(svg => { html += svg; }); }
  track.innerHTML = html;
}

let carouselIdx = 0;
let carouselTimer = null;
function buildCarousel(){
  const el = document.getElementById('photoCarousel');
  const photos = [];
  listings.forEach(l => { (l.photos||[]).forEach(p => photos.push({src:p, caption:l.name})); });
  if(!photos.length){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.innerHTML = photos.slice(0,6).map((p,i) => `
    <div class="pc-card ${i===0?'active':''}" data-i="${i}">
      <img src="${p.src}" alt="${p.caption}">
      <div class="pc-caption">${p.caption}</div>
    </div>
  `).join('');
  carouselIdx = 0;
  if(carouselTimer) clearInterval(carouselTimer);
  if(photos.length > 1){
    carouselTimer = setInterval(() => {
      const cards = el.querySelectorAll('.pc-card');
      cards[carouselIdx].classList.remove('active');
      carouselIdx = (carouselIdx + 1) % cards.length;
      cards[carouselIdx].classList.add('active');
    }, 3200);
  }
}

async function loadListings(){
  try{
    const r = await fetch('/api/listings');
    const data = await r.json();
    listings = data.listings || [];
  }catch(e){ listings = []; }
  try{
    const r = await fetch('/api/settings');
    const data = await r.json();
    if(data.settings) settings = data.settings;
  }catch(e){}
  buildSafariTrack();
  buildCarousel();
  render();
}

async function saveListings(){
  try{
    const r = await fetch('/api/listings', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-admin-password':adminPassword},
      body: JSON.stringify(listings)
    });
    return r.ok;
  }catch(e){ return false; }
  finally{ buildCarousel(); }
}

async function saveSettingsToServer(){
  try{
    const r = await fetch('/api/settings', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-admin-password':adminPassword},
      body: JSON.stringify(settings)
    });
    return r.ok;
  }catch(e){ return false; }
}

async function saveBooking(booking){
  try{
    await fetch('/api/bookings', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(booking)
    });
  }catch(e){ console.error('booking save failed', e); }
}

async function fetchBookings(){
  try{
    const r = await fetch('/api/bookings', { headers:{'x-admin-password':adminPassword} });
    if(!r.ok) return [];
    const data = await r.json();
    return data.bookings || [];
  }catch(e){ return []; }
}

function fmt(n){ return 'KSh ' + Number(n).toLocaleString(); }

function render(){
  const main = document.getElementById('mainArea');
  document.getElementById('heroSection').style.display = currentView === 'browse' ? 'block' : 'none';
  document.getElementById('navBrowse').classList.toggle('active', currentView !== 'admin');
  document.getElementById('navAdmin').classList.toggle('active', currentView === 'admin');
  if(currentView === 'admin'){ renderAdmin(main); } else { renderBrowse(main); }
}

function renderBrowse(main){
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const type = document.getElementById('typeFilter')?.value || '';
  const filtered = listings.filter(l =>
    (!q || l.name.toLowerCase().includes(q) || l.location.toLowerCase().includes(q)) &&
    (!type || l.type === type)
  );
  main.innerHTML = `
    <div class="section-title">
      <h2>Available rooms</h2>
      <span>${filtered.length} listing${filtered.length===1?'':'s'}</span>
    </div>
    ${filtered.length ? `<div class="grid">${filtered.map(cardHtml).join('')}</div>` : `<div class="empty">No rooms match that search yet.</div>`}
  `;
  filtered.forEach(l => {
    document.getElementById('view-' + l.id)?.addEventListener('click', () => openModal(l.id));
  });
}

function cardHtml(l){
  const photo = l.photos && l.photos[0] ? l.photos[0] : placeholderImg(l.type);
  return `
    <div class="listing-card">
      <div class="lc-photo">
        <img src="${photo}" alt="${l.name}">
        <span class="lc-type">${l.type}</span>
      </div>
      <div class="lc-body">
        <h3>${l.name}</h3>
        <p class="lc-loc">${l.location}</p>
        <div class="lc-foot">
          <div class="lc-price">${fmt(l.price)}<br><small>per night</small></div>
          <button class="lc-btn" id="view-${l.id}">View & book</button>
        </div>
      </div>
    </div>
  `;
}

function placeholderImg(type){
  const bg = type === 'Hotel' ? '0F3D3E' : 'C89B3C';
  return `https://placehold.co/400x300/${bg}/FBF7EE?text=${encodeURIComponent(type)}`;
}

function openModal(id){
  modalListing = listings.find(l => l.id === id);
  if(!modalListing) return;
  showModal(bookingModalHtml(modalListing));
  wireBookingModal();
}

function showModal(html){
  let overlay = document.getElementById('overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'overlay';
    overlay.className = 'overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.style.display = 'flex';
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
}

function closeModal(){
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.style.display = 'none';
  modalListing = null;
}

function bookingModalHtml(l){
  const photos = l.photos && l.photos.length ? l.photos : [placeholderImg(l.type)];
  return `
    <div class="modal-photo">
      <img id="modalImg" src="${photos[0]}" alt="${l.name}">
      <button class="modal-close" id="closeModalBtn">&times;</button>
      ${photos.length > 1 ? `<div class="modal-dots">${photos.map((_,i)=>`<span class="dot ${i===0?'active':''}" data-i="${i}"></span>`).join('')}</div>` : ''}
    </div>
    <div class="modal-body">
      <h2>${l.name}</h2>
      <div class="loc">${l.location} · ${l.type}</div>
      <p class="desc">${l.description || ''}</p>
      <div class="row2">
        <div class="field"><label>Check-in</label><input type="date" id="checkin"></div>
        <div class="field"><label>Check-out</label><input type="date" id="checkout"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Guests</label><input type="number" id="guests" min="1" value="2"></div>
        <div class="field"><label>Your phone</label><input type="text" id="phone" placeholder="07XX XXX XXX"></div>
      </div>
      <div class="field" style="margin-bottom:6px;">
        <label>Your name</label><input type="text" id="guestName" placeholder="Full name">
      </div>
      <div class="err" id="formErr" style="display:none;"></div>
      <div class="total-row">
        <span id="nightsLabel">Select dates</span>
        <b id="totalLabel">${fmt(l.price)}</b>
      </div>
      <div class="paybill-box">
        <div class="paybill-row"><span>M-Pesa Paybill</span><b>${settings.paybill}</b></div>
        <div class="paybill-row"><span>Account number</span><b>${settings.account}</b></div>
        <ol class="paybill-steps">
          <li>Go to M-Pesa &gt; Lipa na M-Pesa &gt; Paybill</li>
          <li>Enter the paybill and account number above</li>
          <li>Enter the total shown and confirm</li>
        </ol>
      </div>
      <button class="pay-btn" id="payBtn">I've paid — submit booking</button>
      <p class="note">Your host confirms the room once payment is received on the paybill.</p>
    </div>
  `;
}

function wireBookingModal(){
  document.getElementById('closeModalBtn').onclick = closeModal;
  const photos = modalListing.photos && modalListing.photos.length ? modalListing.photos : [placeholderImg(modalListing.type)];
  document.querySelectorAll('.dot').forEach(dot => {
    dot.onclick = () => {
      const i = Number(dot.dataset.i);
      document.getElementById('modalImg').src = photos[i];
      document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
      dot.classList.add('active');
    };
  });

  const ci = document.getElementById('checkin');
  const co = document.getElementById('checkout');
  const updateTotal = () => {
    const d1 = new Date(ci.value), d2 = new Date(co.value);
    const nights = (ci.value && co.value && d2 > d1) ? Math.round((d2 - d1) / 86400000) : 0;
    document.getElementById('nightsLabel').textContent = nights > 0 ? `${nights} night${nights>1?'s':''}` : 'Select dates';
    document.getElementById('totalLabel').textContent = fmt(nights > 0 ? nights * modalListing.price : modalListing.price);
  };
  ci.addEventListener('change', updateTotal);
  co.addEventListener('change', updateTotal);

  document.getElementById('payBtn').onclick = async () => {
    const errEl = document.getElementById('formErr');
    const name = document.getElementById('guestName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const guests = document.getElementById('guests').value;
    if(!name || !phone || !ci.value || !co.value){
      errEl.style.display = 'block';
      errEl.textContent = 'Fill in your name, phone number and both dates first.';
      return;
    }
    if(new Date(co.value) <= new Date(ci.value)){
      errEl.style.display = 'block';
      errEl.textContent = 'Check-out must be after check-in.';
      return;
    }
    errEl.style.display = 'none';
    const btn = document.getElementById('payBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting…';
    const nights = Math.round((new Date(co.value) - new Date(ci.value)) / 86400000);
    const total = nights * modalListing.price;
    const booking = {
      listingId: modalListing.id, listingName: modalListing.name,
      name, phone, guests, checkin: ci.value, checkout: co.value, nights, total
    };
    await saveBooking(booking);
    showModal(confirmHtml(booking));
    document.getElementById('closeConfirmBtn').onclick = closeModal;
  };
}

function confirmHtml(b){
  return `
    <div class="confirm">
      <div class="badge">&#10003;</div>
      <h2>Booking request sent</h2>
      <p>${b.name}, your request for <b>${b.listingName}</b> (${b.nights} night${b.nights>1?'s':''}, ${fmt(b.total)}) is in. Once your paybill payment reflects, the host will confirm the room directly with you on ${b.phone}.</p>
      <button id="closeConfirmBtn">Done</button>
    </div>
  `;
}

// ---------- Admin ----------
let draftPhotos = [];

async function renderAdmin(main){
  if(!adminUnlocked){
    main.innerHTML = `<div class="empty">Checking admin status…</div>`;
    let hasPassword = false;
    try{
      const r = await fetch('/api/admin-auth');
      const data = await r.json();
      hasPassword = !!data.hasPassword;
    }catch(e){
      main.innerHTML = `<div class="empty">Could not reach the server — check your connection and try again.</div>`;
      return;
    }

    if(!hasPassword){
      main.innerHTML = `
        <div class="setup-box">
          <h3>Create your admin passcode</h3>
          <p>No passcode is set up yet. Choose one now — this is what will unlock Admin from here on, on any device.</p>
          <input type="password" id="setupPass" placeholder="New passcode (min 8 characters)">
          <input type="password" id="setupPass2" placeholder="Confirm passcode">
          <div class="err" id="setupErr" style="display:none;"></div>
          <button id="setupBtn">Set passcode</button>
        </div>
      `;
      const submit = async () => {
        const p1 = document.getElementById('setupPass').value;
        const p2 = document.getElementById('setupPass2').value;
        const btn = document.getElementById('setupBtn');
        const errEl = document.getElementById('setupErr');
        errEl.style.display = 'none';
        if(p1.length < 8){ errEl.textContent = 'Use at least 8 characters.'; errEl.style.display = 'block'; return; }
        if(p1 !== p2){ errEl.textContent = 'Passcodes do not match.'; errEl.style.display = 'block'; return; }
        btn.disabled = true; btn.textContent = 'Setting up…';
        try{
          const r = await fetch('/api/admin-auth', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ action:'setup', password: p1 })
          });
          const data = await r.json();
          if(data.ok){ adminPassword = p1; adminUnlocked = true; render(); }
          else{ errEl.textContent = data.error || 'Could not set passcode.'; errEl.style.display = 'block'; }
        }catch(e){ errEl.textContent = 'Could not reach the server.'; errEl.style.display = 'block'; }
        btn.disabled = false; btn.textContent = 'Set passcode';
      };
      document.getElementById('setupBtn').onclick = submit;
      return;
    }

    main.innerHTML = `
      <div class="admin-gate">
        <h3 style="margin:0 0 4px;">Admin access</h3>
        <p style="font-size:13px;color:var(--ink-soft);margin:0;">Enter your passcode to add listings or edit payment details.</p>
        <input type="password" id="passInput" placeholder="Passcode">
        <div class="err" id="passErr" style="display:none;"></div>
        <button id="unlockBtn">Unlock</button>
      </div>
    `;
    const attempt = async () => {
      const val = document.getElementById('passInput').value;
      const btn = document.getElementById('unlockBtn');
      const errEl = document.getElementById('passErr');
      btn.disabled = true; btn.textContent = 'Checking…'; errEl.style.display = 'none';
      try{
        const r = await fetch('/api/admin-auth', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ action:'login', password: val })
        });
        const data = await r.json();
        if(data.ok){ adminPassword = val; adminUnlocked = true; render(); }
        else{ errEl.textContent = data.error || 'Wrong passcode.'; errEl.style.display = 'block'; }
      }catch(e){
        errEl.textContent = 'Could not reach the server — check your connection.';
        errEl.style.display = 'block';
      }
      btn.disabled = false; btn.textContent = 'Unlock';
    };
    document.getElementById('unlockBtn').onclick = attempt;
    document.getElementById('passInput').addEventListener('keyup', e => { if(e.key==='Enter') attempt(); });
    return;
  }

  main.innerHTML = `
    <div class="admin-form">
      <h3>Payment settings</h3>
      <p class="hint">This is where clients' M-Pesa payments land. Shown to every guest at checkout.</p>
      <div class="row2">
        <div class="field"><label>Paybill number</label><input type="text" id="s_paybill" value="${settings.paybill}"></div>
        <div class="field"><label>Account number</label><input type="text" id="s_account" value="${settings.account}"></div>
      </div>
      <button class="save-btn" id="savePaymentBtn">Save payment details</button>
      <span class="saved-tag" id="paymentSavedTag">Saved</span>
    </div>

    <div class="admin-form">
      <h3>Add a new listing</h3>
      <p class="hint">Photos here are what clients see in the browse page and hero.</p>
      <div class="field"><label>Name</label><input type="text" id="f_name" placeholder="e.g. Lakeview Cottage"></div>
      <div class="row2">
        <div class="field"><label>Type</label><select id="f_type"><option>Airbnb</option><option>Hotel</option></select></div>
        <div class="field"><label>Price per night (KSh)</label><input type="number" id="f_price" placeholder="4500"></div>
      </div>
      <div class="field"><label>Location</label><input type="text" id="f_location" placeholder="e.g. Karagita, near the lake"></div>
      <div class="field"><label>Description</label><textarea id="f_desc" placeholder="What makes this place worth booking"></textarea></div>
      <div class="field">
        <label>Photos</label>
        <div class="photo-row" id="photoRow"></div>
        <input type="file" id="f_photos" accept="image/*" multiple style="display:none;">
        <button type="button" class="upload-btn" id="uploadBtn">+ Add photos</button>
      </div>
      <div class="err" id="adminErr" style="display:none;"></div>
      <button class="save-btn" id="addListingBtn">Save listing</button>
    </div>
    <div class="section-title"><h2>Your listings</h2><span>${listings.length} total</span></div>
    <div id="adminList"></div>

    <div class="section-title" style="margin-top:32px;"><h2>Revenue by listing</h2><span></span></div>
    <div id="revenueTable"><div class="empty">Loading…</div></div>

    <div class="section-title" style="margin-top:32px;"><h2>Booking requests</h2><span></span></div>
    <div id="bookingsList"><div class="empty">Loading…</div></div>

    <div class="admin-form" style="margin-top:32px;">
      <h3>Change passcode</h3>
      <p class="hint">Update the passcode that unlocks this Admin section.</p>
      <div class="change-pass-form">
        <input type="password" id="cp_current" placeholder="Current passcode">
        <input type="password" id="cp_new" placeholder="New passcode (min 8 characters)">
        <input type="password" id="cp_new2" placeholder="Confirm new passcode">
        <div class="err" id="cpErr" style="display:none;"></div>
        <button class="save-btn" id="changePassBtn" style="margin-top:2px;">Update passcode</button>
        <span class="saved-tag" id="cpSavedTag">Updated</span>
      </div>
    </div>
  `;

  renderPhotoRow();
  renderAdminList();
  loadBookingsAndRevenue();

  document.getElementById('changePassBtn').onclick = async () => {
    const current = document.getElementById('cp_current').value;
    const p1 = document.getElementById('cp_new').value;
    const p2 = document.getElementById('cp_new2').value;
    const errEl = document.getElementById('cpErr');
    const btn = document.getElementById('changePassBtn');
    errEl.style.display = 'none';
    if(p1.length < 8){ errEl.textContent = 'New passcode must be at least 8 characters.'; errEl.style.display = 'block'; return; }
    if(p1 !== p2){ errEl.textContent = 'New passcodes do not match.'; errEl.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Updating…';
    try{
      const r = await fetch('/api/admin-auth', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ action:'change', currentPassword: current, newPassword: p1 })
      });
      const data = await r.json();
      if(data.ok){
        adminPassword = p1;
        document.getElementById('cp_current').value = '';
        document.getElementById('cp_new').value = '';
        document.getElementById('cp_new2').value = '';
        const tag = document.getElementById('cpSavedTag');
        tag.classList.add('show');
        setTimeout(() => tag.classList.remove('show'), 1800);
      }else{
        errEl.textContent = data.error || 'Could not update passcode.';
        errEl.style.display = 'block';
      }
    }catch(e){
      errEl.textContent = 'Could not reach the server.';
      errEl.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Update passcode';
  };

  document.getElementById('savePaymentBtn').onclick = async () => {
    const btn = document.getElementById('savePaymentBtn');
    btn.disabled = true;
    settings.paybill = document.getElementById('s_paybill').value.trim();
    settings.account = document.getElementById('s_account').value.trim();
    const ok = await saveSettingsToServer();
    btn.disabled = false;
    if(ok){
      const tag = document.getElementById('paymentSavedTag');
      tag.classList.add('show');
      setTimeout(() => tag.classList.remove('show'), 1800);
    }
  };

  document.getElementById('uploadBtn').onclick = () => document.getElementById('f_photos').click();
  document.getElementById('f_photos').onchange = handlePhotoUpload;
  document.getElementById('addListingBtn').onclick = handleAddListing;
}

async function loadBookingsAndRevenue(){
  const bookings = await fetchBookings();
  renderBookingsList(bookings);
  renderRevenueTable(bookings);
}

function renderBookingsList(bookings){
  const el = document.getElementById('bookingsList');
  if(!el) return;
  if(!bookings.length){ el.innerHTML = `<div class="empty">No booking requests yet.</div>`; return; }
  el.innerHTML = bookings.map(b => `
    <div class="booking-item">
      <div class="binfo">
        <b>${b.name}</b> — ${b.listingName}
        <div class="meta">${b.checkin} → ${b.checkout} · ${b.nights} night${b.nights>1?'s':''} · ${fmt(b.total)} · ${b.phone}</div>
      </div>
      <button class="paid-toggle ${b.paid ? 'is-paid' : 'not-paid'}" data-id="${b.id}" data-paid="${b.paid ? '1':'0'}">
        ${b.paid ? '✓ Paid' : 'Mark as paid'}
      </button>
    </div>
  `).join('');
  el.querySelectorAll('.paid-toggle').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      const newPaid = btn.dataset.paid !== '1';
      try{
        await fetch('/api/bookings', {
          method:'PATCH',
          headers:{'Content-Type':'application/json','x-admin-password':adminPassword},
          body: JSON.stringify({ id: btn.dataset.id, paid: newPaid })
        });
      }catch(e){}
      loadBookingsAndRevenue();
    };
  });
}

function renderRevenueTable(bookings){
  const el = document.getElementById('revenueTable');
  if(!el) return;
  if(!bookings.length){ el.innerHTML = `<div class="empty">No bookings yet — revenue will show here once clients start booking.</div>`; return; }

  const byListing = {};
  bookings.forEach(b => {
    if(!byListing[b.listingId]) byListing[b.listingId] = { name: b.listingName, count: 0, requested: 0, paid: 0 };
    byListing[b.listingId].count += 1;
    byListing[b.listingId].requested += Number(b.total) || 0;
    if(b.paid) byListing[b.listingId].paid += Number(b.total) || 0;
  });

  const rows = Object.values(byListing);
  const totalPaid = rows.reduce((s,r) => s + r.paid, 0);
  const totalRequested = rows.reduce((s,r) => s + r.requested, 0);
  const totalCommission = totalPaid * 0.10;
  const totalPayout = totalPaid * 0.90;

  el.innerHTML = `
    <table class="revenue-table">
      <thead>
        <tr><th>Listing</th><th>Bookings</th><th>Requested</th><th>Paid</th><th>Your 10%</th><th>Owed to host</th></tr>
      </thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${r.name}</td>
            <td>${r.count}</td>
            <td>${fmt(r.requested)}</td>
            <td>${fmt(r.paid)}</td>
            <td>${fmt(r.paid * 0.10)}</td>
            <td>${fmt(r.paid * 0.90)}</td>
          </tr>
        `).join('')}
      </tbody>
      <tfoot>
        <tr>
          <td>Total</td><td>${bookings.length}</td>
          <td>${fmt(totalRequested)}</td>
          <td>${fmt(totalPaid)}</td>
          <td>${fmt(totalCommission)}</td>
          <td>${fmt(totalPayout)}</td>
        </tr>
      </tfoot>
    </table>
    <p class="revenue-note">"Paid" totals only count bookings you've marked as paid in the list below, so this reflects real cash received, not just requests.</p>
  `;
}

function renderPhotoRow(){
  const row = document.getElementById('photoRow');
  row.innerHTML = draftPhotos.map((p,i) => `
    <div class="photo-thumb"><img src="${p}"><button data-i="${i}" class="rmPhoto">&times;</button></div>
  `).join('');
  row.querySelectorAll('.rmPhoto').forEach(btn => {
    btn.onclick = () => { draftPhotos.splice(Number(btn.dataset.i),1); renderPhotoRow(); };
  });
}

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 800;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoUpload(e){
  const files = Array.from(e.target.files).slice(0, 6 - draftPhotos.length);
  for(const f of files){
    try{ draftPhotos.push(await resizeImage(f)); }catch(err){ console.error(err); }
  }
  renderPhotoRow();
  e.target.value = '';
}

async function handleAddListing(){
  const errEl = document.getElementById('adminErr');
  const btn = document.getElementById('addListingBtn');
  const name = document.getElementById('f_name').value.trim();
  const type = document.getElementById('f_type').value;
  const price = Number(document.getElementById('f_price').value);
  const location = document.getElementById('f_location').value.trim();
  const desc = document.getElementById('f_desc').value.trim();

  if(!name || !location || !price || price <= 0){
    errEl.style.display = 'block';
    errEl.textContent = 'Add a name, location and a price above zero.';
    return;
  }
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Saving…';

  listings.unshift({
    id: 'l_' + Date.now(), name, type, price, location, description: desc, photos: [...draftPhotos]
  });
  draftPhotos = [];
  const ok = await saveListings();
  btn.disabled = false; btn.textContent = 'Save listing';
  if(!ok){
    errEl.style.display = 'block';
    errEl.textContent = 'Could not save — check your connection and try again.';
    return;
  }
  render();
}

function renderAdminList(){
  const el = document.getElementById('adminList');
  if(!listings.length){ el.innerHTML = `<div class="empty">No listings yet — add your first one above.</div>`; return; }
  el.innerHTML = listings.map(l => `
    <div class="admin-list-item">
      <img src="${l.photos && l.photos[0] ? l.photos[0] : placeholderImg(l.type)}">
      <div class="info">
        <b>${l.name}</b><span class="status">${l.type}</span>
        <div>${l.location} · ${fmt(l.price)}/night</div>
      </div>
      <button class="del-btn" data-id="${l.id}">Remove</button>
    </div>
  `).join('');
  el.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      listings = listings.filter(l => l.id !== btn.dataset.id);
      await saveListings();
      renderAdminList();
      document.querySelectorAll('.section-title span')[0].textContent = listings.length + ' total';
    };
  });
}

document.getElementById('navBrowse').onclick = () => { currentView = 'browse'; render(); };
document.getElementById('navAdmin').onclick = () => { currentView = 'admin'; render(); };

document.getElementById('searchInput').addEventListener('keyup', (e) => { if(e.key==='Enter') renderBrowse(document.getElementById('mainArea')); });
document.getElementById('typeFilter').addEventListener('change', () => renderBrowse(document.getElementById('mainArea')));

loadListings();
